<!doctype html>
<!-- phone-sensors.png for the README (sensors + pickup notification), rendered by scripts/render_mockups.py.
     Icons are simple own drawings in the style of the Home Assistant icons.
     The Home Assistant app icon (assets/raw/ha-app-icon.png) is not part of the repository; place it there before rendering. -->
<html><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Roboto, "Helvetica Neue", Arial, sans-serif; }
  .stage { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
           background: radial-gradient(1200px 700px at 30% 20%, #e8f1ff 0%, #dfe7f3 45%, #cfd9e8 100%); }
  .phone { position: relative; background: linear-gradient(145deg, #2b2d31, #121315); border-radius: 48px; padding: 13px;
           box-shadow: 0 40px 70px -18px rgba(16,24,40,.55), inset 0 0 0 2px rgba(255,255,255,.07); }
  .screen { position: relative; overflow: hidden; border-radius: 36px; background: #fafafa; height: 760px; color: #212121; }
  .notch { position: absolute; top: 12px; left: 50%; width: 92px; height: 26px; margin-left: -46px; background: #0d0d0e; border-radius: 14px; z-index: 5; }
  .status { height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0; font-size: 15px; font-weight: 600; color: #111; }
  .status .r { display: flex; gap: 6px; align-items: center; }
  .status .bat { width: 24px; height: 11px; border: 1.5px solid #111; border-radius: 3px; position: relative; }
  .status .bat::after { content: ""; position: absolute; inset: 1.5px; right: 6px; background: #111; border-radius: 1px; }
  .appbar { height: 56px; display: flex; align-items: center; gap: 18px; padding: 0 18px; font-size: 20px; color: #212121; }
  .appbar svg { width: 24px; height: 24px; fill: #212121; opacity: .9; }
  .content { padding: 58px 12px 8px; }
  .card { background: #fff; border-radius: 12px; border: 1px solid #e0e0e0; box-shadow: 0 1px 3px rgba(0,0,0,.06); padding: 6px 0 10px; }
  .card h2 { margin: 0; padding: 14px 16px 8px; font-size: 22px; font-weight: 400; }
  .row { display: flex; align-items: center; gap: 16px; padding: 10px 16px; min-height: 56px; }
  .row .ic { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; }
  .row .ic svg { width: 24px; height: 24px; fill: #44739e; }
  .row .ic.on svg { fill: #fdd835; }
  .row .name { flex: 1; font-size: 15px; line-height: 1.3; }
  .row .name small { display: block; color: #727272; font-size: 13px; }
  .row .val { font-size: 15px; text-align: right; }
  .attrs { margin: 12px 0 0; background: #1c1c1c; border-radius: 12px; border: 1px solid rgba(225,225,225,.12); padding: 14px 16px; font-size: 14px; }
  .attrs h3 { margin: 0 0 8px; font-size: 13px; font-weight: 500; color: #9b9b9b; letter-spacing: .06em; text-transform: uppercase; }
  .attrs div { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px solid rgba(225,225,225,.08); }
  .attrs div:first-of-type { border-top: none; }
  .attrs code { color: #9b9b9b; font-family: "Roboto Mono", Menlo, monospace; font-size: 13px; }

  /* notification banner */
  .note { position: absolute; top: 46px; left: 10px; right: 10px; z-index: 4; border-radius: 22px; padding: 14px 16px;
          background: rgba(255,255,255,.97); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          box-shadow: 0 12px 30px rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.05); display: flex; gap: 12px; color: #111; }
  .note img { width: 38px; height: 38px; border-radius: 9px; flex: none; background: #fff; padding: 3px; }
  .note .appicon { width: 38px; height: 38px; border-radius: 9px; flex: none; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.08); }
  .note .appicon svg { width: 22px; height: 22px; fill: #fff; }
  .note .head { display: flex; justify-content: space-between; font-size: 13px; color: rgba(0,0,0,.5); margin-bottom: 2px; }
  .note .t { font-size: 15px; font-weight: 600; }
  .note .b { font-size: 15px; line-height: 1.3; }
  .dim { }
</style></head>
<body>
<div id="phone-sensors" class="stage" style="width:900px;height:960px">
  <div class="phone" style="width:400px">
    <div class="screen">
      <div class="note">
        <img class="appicon" src="../raw/ha-app-icon.png" alt="">
        <div style="flex:1">
          <div class="head"><span>Home Assistant</span><span>now</span></div>
          <div class="t">Pickup reminder</div>
          <div class="b">Emma needs to be picked up in 15 minutes.</div>
        </div>
      </div>
      <div class="dim">
        <div class="status"><span>17:00</span><span class="r"><span class="bat"></span></span></div>
        <div class="appbar">
          <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
          <span>School</span>
        </div>
        <div class="content">
          <div class="card">
            <h2>Emma</h2>
            <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3zM5 13.2v4L12 21l7-3.8v-4L12 17l-7-3.8z"/></svg></span>
              <span class="name">Current lesson</span><span class="val">Basketball</span></div>
            <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zm10-12v12h2V6h-2z"/></svg></span>
              <span class="name">Next lesson</span><span class="val">History</span></div>
            <div class="row"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.1-1.6-5.6-4.5-6.3V4a1.5 1.5 0 0 0-3 0v.7C7.6 5.4 6 7.9 6 11v5l-2 2v1h16v-1l-2-2z"/><path d="M4.3 3.6 3 2.2A10.4 10.4 0 0 0 0 9.5h2a8.5 8.5 0 0 1 2.3-5.9zM22 9.5h2a10.4 10.4 0 0 0-3-7.3l-1.3 1.4A8.5 8.5 0 0 1 22 9.5z"/></svg></span>
              <span class="name">Lessons end today</span><span class="val">5 hours ago</span></div>
            <div class="row"><span class="ic"><svg viewBox="0 0 24 24" style="fill:none;stroke:#44739e;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><circle cx="12.5" cy="5" r="2.2" style="fill:#44739e;stroke:none"/><path d="M5 3.5c-.8 4 0 9 3 12.5h9.5l2 3.5"/><path d="M11.5 9.5l-1 4.5h5.5"/><path d="M13 10.5l4-2.5"/></svg></span>
              <span class="name">Pickup time today</span><span class="val">in 15 minutes</span></div>
          </div>
</div>
      </div>
    </div>
  </div>
</div>
</body></html>
